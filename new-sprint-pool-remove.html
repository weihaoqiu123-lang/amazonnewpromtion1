<!DOCTYPE html><html lang='zh-CN'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>移除新品冲刺池</title><link rel='stylesheet' href='styles.css'></head><body>
<div class='topbar'>
  <div class='brand'><div class='brand-badge'>⚡</div><div>量子加速器</div></div>
  <div class='menu'><div>总览</div><div>我的指令</div><div>统一授权</div><div class='active'>产品管理</div><div>广告系统</div><div>发票管理</div><div>环保系统</div></div>
  <div class='top-actions'><a class='ghost-btn' href='new-sprint-pool.html'>返回新品冲刺池</a></div>
</div>
<div class='page'>
  <div class='page-title'>新品冲刺池</div>
  <div class='page-sub'>移除冲刺池时必须填写原因。已开启冲刺的商品移除后，需要先回到正常大盘价并成功推送，才会转为已完结。</div>
</div>
<div class='modal-backdrop'>
  <div class='modal'>
    <div class='header-row'><div class='section-title'>移除出新品冲刺池</div><a class='link-btn' href='new-sprint-pool.html'>关闭</a></div>
    <div class='alert'>移除后该商品将不再出现在本轮新品冲刺池。若商品已开启冲刺，后续仍需在货品定价页确认正常大盘价并完成推送。</div>
    <div class='form-grid'>
      <div class='field'><label>SKU</label><input class='input' value='CM25631US-24'></div>
      <div class='field'><label>国家</label><input class='input' value='US'></div>
      <div class='field'><label>当前状态</label><input class='input' value='冲刺中 · D28待撤销涨价'></div>
      <div class='field'><label>运营负责人</label><input class='input' value='胡智辉'></div>
    </div>
    <div class='field' style='margin-top:14px'><label>移除原因（必填）</label>
      <select class='select' style='width:100%'><option>请选择移除原因</option><option>库存风险</option><option>非AM渠道动销更好</option><option>竞品环境不适合继续冲刺</option><option>其他业务原因</option></select>
    </div>
    <div class='field' style='margin-top:14px'><label>详细说明（必填）</label><textarea class='textarea' placeholder='请输入不少于10个字的说明，例如：D28累计销量仅35件，系统建议回退价格，产线综合评估后决定结束本轮冲刺。'></textarea></div>
    <div class='notice'>如果当前商品已开启冲刺，点击「确认移除」后建议跳转到货品定价详情，由产线设置恢复后的正常大盘价并点击确认推送。</div>
    <div class='actions'><a class='ghost-btn' href='new-sprint-pool.html'>取消</a><a class='btn' href='pricing-sprint.html'>确认移除并去定价</a></div>
  </div>
</div>
</body></html>
